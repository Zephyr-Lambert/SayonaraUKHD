; SayonaraUKHD settings. Restart the game after editing this file.
; Any setting that is missing counts as off (0).

[Rendering]
Enabled=1
Width=3840
Height=2160
; Internal 3D rendering resolution. Usually your screen resolution, or higher for
; supersampling. Width 320..7168, height 240..8192. Invalid values fall back to the
; game's original resolution (with Log=1, see UmiGraphics.log).

[AspectRatio]
Enabled=1
; Real aspect-ratio change instead of stretching the 16:9 picture.
; Follows the game's own aspect-ratio slider automatically:
; wider shows more left/right, narrower shows more above/below.
; HUD and menus keep their original layout.

FixCulling=1
; Draw objects that come into view at the newly visible edges, instead of
; letting them pop in. Needs AspectRatio Enabled=1.

[Antialiasing]
Enabled=1
; FXAA edge smoothing on the 3D scene (the HUD is not blurred).
; F7 toggles it on/off while playing, for comparison. The toggle is not saved.

[Textures]
Dump=0
; 1 = save the game's textures to Textures\dump as you play.
; Visit menus and stages to collect them, then set back to 0.
; Loading is slower while dumping.

Replacement=1
; Load your edited textures (DDS or PNG) from Textures\replace.
; Files must keep the exact name of the dumped original. See readme.txt.

MaxDumpFiles=2048
; Maximum new dump files per launch (1..4096). Also capped at 512 MiB per launch.

[Debug]
Log=0
; 1 = write UmiGraphics.log next to the game (settings read, loaded textures,
; problems found). 0 = no log file is created or written.
; Turn it on when troubleshooting or reporting a problem.

VerboseLog=0
; 1 = write detailed per-draw information to UmiGraphics.log (needs Log=1).
; Useful for troubleshooting; costs some performance.

Diagnostics=0
; Developer tools only: saves shader bytecode and enables F8 frame captures in
; SayonaraUKHD-debug. Not needed to use the mod.
